
name: Build UDIN AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - - name: Extract project
  run: unzip -q UDIN_AI_full_dark_with_icon.zip

      - name: Build APK
        run: gradle -p UDIN_AI assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UDIN-AI-APK
          path: UDIN_AI/app/build/outputs/apk/debug/app-debug.apk
